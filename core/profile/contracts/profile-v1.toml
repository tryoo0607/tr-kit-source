schema_version = 1
fragment_schema_version = 1
allowed_roots = ["public", "extensions"]
allowed_value_types = ["string", "integer", "float", "boolean"]
extension_pattern = "[a-z][a-z0-9-]*"
secret_segments = [
  "secret",
  "secrets",
  "password",
  "passwords",
  "token",
  "tokens",
  "credential",
  "credentials",
  "private_key",
  "api_key",
]
precedence = "filename-ascending-last-wins"

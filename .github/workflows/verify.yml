name: verify-only
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Prepare pinned scanner outside source
        id: scanner
        run: |
          python3 -B - <<'PY'
          import os, sys, tomllib
          from pathlib import Path
          sys.path.insert(0, 'common/base/scripts')
          import toolchain
          version = tomllib.loads(Path('common/base/scripts/secret-tools.toml').read_text())['gitleaks']['version']
          prefix = Path.home()/'.local/share/tr-kit/gitleaks'/version
          prefix.parent.mkdir(parents=True, exist_ok=True)
          plan = toolchain.plan('gitleaks', prefix, Path.cwd())
          toolchain.apply(plan, toolchain.plan_id(plan))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('path='+str(prefix/'bin/gitleaks')+'\n')
          PY
      - name: Run local CI equivalent
        run: python3 -B scripts/ci-check.py --gitleaks "${{ steps.scanner.outputs.path }}" --output "$RUNNER_TEMP/g5-verification"
      - name: Report test failure identifiers
        if: failure()
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'])/'g5-verification/tests.log'
          if path.is_file():
              for line in path.read_text(errors='replace').splitlines():
                  if line.startswith(('FAIL: ', 'ERROR: ', 'Ran ', 'FAILED (')):
                      print(line)
          PY
      # Deliberately no push trigger, credentials, source fetch/vendor step,
      # artifact upload, deployment keys or delivery/publishing job.

name: verify and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tr-kit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Prepare pinned scanner outside source
        id: scanner
        run: |
          python3 -B - <<'PY'
          import os, sys, tomllib
          from pathlib import Path
          sys.path.insert(0, 'common/base/scripts')
          import toolchain
          version = tomllib.loads(Path('common/base/scripts/secret-tools.toml').read_text())['gitleaks']['version']
          prefix = Path.home()/'.local/share/tr-kit/gitleaks'/version
          prefix.parent.mkdir(parents=True, exist_ok=True)
          plan = toolchain.plan('gitleaks', prefix, Path.cwd())
          toolchain.apply(plan, toolchain.plan_id(plan))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('path='+str(prefix/'bin/gitleaks')+'\n')
          PY
      - name: Run local CI equivalent
        run: python3 -B scripts/ci-check.py --gitleaks "${{ steps.scanner.outputs.path }}" --output "$RUNNER_TEMP/g5-verification"
      - name: Report test failure identifiers
        if: failure()
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'])/'g5-verification/tests.log'
          if path.is_file():
              for line in path.read_text(errors='replace').splitlines():
                  if line.startswith(('FAIL: ', 'ERROR: ', 'Ran ', 'FAILED (')):
                      print(line)
          PY
      - name: Build and verify both marketplace trees
        run: |
          baseline=30604482896d2b3607302abea13923dcc02ff116
          git merge-base --is-ancestor "$baseline" HEAD
          revisions=$(git rev-list --first-parent --count "$baseline"..HEAD)
          python3 -B .github/scripts/build-marketplaces.py "$RUNNER_TEMP/marketplaces" "0.8.$((10 + revisions))"
      - name: Publish both marketplace trees
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          TR_CODEX_DEPLOY_KEY: ${{ secrets.TR_CODEX_DEPLOY_KEY }}
          TR_CLAUDE_DEPLOY_KEY: ${{ secrets.TR_CLAUDE_DEPLOY_KEY }}
        run: bash .github/scripts/publish-marketplaces.sh "$RUNNER_TEMP/marketplaces" "${{ steps.scanner.outputs.path }}"

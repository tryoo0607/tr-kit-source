name: delivery dry-run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-dry-run
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.KIT_DELIVERY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: require cross-repository read token
        run: test -n "$GH_TOKEN"

      - name: validate source and all targets
        run: python3 tools/validate.py full

      - name: verify recipe delivery without push
        run: python3 -m tools.delivery --clone-root "$RUNNER_TEMP/delivery-targets"

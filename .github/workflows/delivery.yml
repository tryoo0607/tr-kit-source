name: delivery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tr-kit-delivery-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  verify-and-deliver:
    uses: ./.github/workflows/build.yml
    with:
      deploy: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    secrets: inherit

# 의도: 일반 구조 시각화의 기본 선택과 명시적인 사용자 도구 선택을 연결한다.
# 보존: 수치 및 업무 차트는 diagram-design과 구분하고 생성 요청을 설치나 게시 승인으로 확대하지 않는다.
schema_version = 1
runtime_note = """
## 이 배포본의 연결

구조도, 구성 관계, 의존성, 처리 흐름, 시퀀스, ERD와 상태 표현의 기본 도구다. 수치 차트와 일정, 칸반, 사용자 여정 등 업무 시각화는 [diagram-design](../diagram-design/SKILL.md)에 맡긴다. 사용자가 도구를 명시하면 그 선택을 우선한다. 하나의 결과물에 두 도구를 기본으로 연속 적용하지 않는다. 완성된 구조와 기존 근거는 재사용하고 원본 설계 결정을 새로 확정하지 않는다.

원본 절차와 선택한 유형의 자료만 적용한다. bin/archify.mjs는 이 배포 skill 루트의 절대경로로 실행한다. JSON의 관계는 에이전트가 판단한 내용이며 소스 파일, 줄과 commit 검증을 관계 의미의 자동 증명으로 취급하지 않는다. Node와 원본 browser-check에 필요한 브라우저의 실제 가용성을 확인하고 부재를 알린다. 생성 요청을 도구 설치, npm 실행, 전역 설정 변경, 공개 게시나 pinned source 갱신으로 확대하지 않는다. 원본 업데이트 알림은 별도 source 변경의 승인이 아니다.

사용자가 지정한 경로와 기존 작업 산출물 위치를 우선하고 새 전역 저장 경로를 만들지 않는다. 원본의 meta.output 및 실행 위치 계약을 함께 만족하도록 명시한다. 완료 기록이 필요하면 document에 실제 산출물과 검증 근거를 전달한다. 실행 실패를 다른 도구로 조용히 대체하지 않으며 자동 검사와 실제 화면 확인을 구분한다.
"""

[[replacements]]

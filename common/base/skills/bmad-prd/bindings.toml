# 의도: 해당 PRD와 합의 및 정정의 소비를 공통 전환 절과 선택적 공동 작성에 연결한다.
# 보존: PRD의 요구, 산출 형식과 사실 검증 책임 및 원본 절차를 유지한다.
schema_version = 1
runtime_note = "## 요구와 합의 연결\n\n작성, 갱신 또는 검증 시 해당 PRD, 기존 합의와 출처, 최신 사용자 정정을 소비한다. 중요한 요구 해석, 사용 흐름의 순서나 책임 변경, 권한 충돌은 [작업 흐름](../../workflow.md)의 '요구 변경과 전환'을 적용한다. 검증에서는 반영한 요구와 출처, 남은 가정과 미결을 PRD 및 검증 결과와 대조하며 실패와 미실행 판정에는 '검증과 실패'를 적용한다. 원본 PRD 작업과 검증 절차를 유지하며 렌더 후에도 이 연결을 적용한다.\n\n## 선택적 공동 작성 연결\n\n독자와 설명 깊이를 맞추거나 자료를 문서로 다듬는 과정이 필요할 때만 [doc-coauthoring](../doc-coauthoring/SKILL.md)에 요청된 정본, 기존 자료, 독자와 보존할 요구를 전달해 해당 지침을 적용한다. 결과는 문서 수정과 독자 관점의 모호함이며 이 skill의 요구, 산출 형식과 사실 검증 및 완료 판단은 유지한다. 이미 충분한 결과는 재사용하고 별도 계획이나 사본을 만들지 않는다. 대상 부재 시 이 skill의 원래 절차로 작성하고 독립 독자 검토의 미실행을 밝힌다. README 작성, 파일 검색, 기록 보관과 게시는 기존 담당을 유지한다."

runtime_note = "## 선택적 공동 작성 연결\n\n독자와 설명 깊이를 맞추거나 자료를 문서로 다듬는 과정이 필요할 때만 [doc-coauthoring](../doc-coauthoring/SKILL.md)에 요청된 정본, 기존 자료, 독자와 보존할 요구를 전달해 해당 지침을 적용한다. 결과는 문서 수정과 독자 관점의 모호함이며 이 skill의 요구, 산출 형식과 사실 검증 및 완료 판단은 유지한다. 이미 충분한 결과는 재사용하고 별도 계획이나 사본을 만들지 않는다. 대상 부재 시 이 skill의 원래 절차로 작성하고 독립 독자 검토의 미실행을 밝힌다. README 작성, 파일 검색, 기록 보관과 게시는 기존 담당을 유지한다."

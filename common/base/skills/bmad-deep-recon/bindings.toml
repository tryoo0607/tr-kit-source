## 문서 근거와 표현 연결

일반 조사와 대안 선정은 이 skill이 소유한다. 라이브러리 API나 특정 버전의 근거가 필요한 부분만 [find-docs](../find-docs/SKILL.md)에 라이브러리, 버전과 질문을 전달해 적용하고 출처와 확인 범위를 받는다. Context7 결과를 전체 조사나 비교의 대체로 쓰지 않는다. 이미 충분한 공식 근거가 있으면 추가 조회하지 않는다.

조사 결과를 그림으로 설명할 필요가 있을 때만 [diagram-design](../diagram-design/SKILL.md)에 확인된 내용, 독자와 산출 형식을 전달해 적용한다. 결과 파일과 생략 내역을 받고 원본 조사 근거를 보존한다. 대상 부재는 조사 전체를 차단하지 않으며 미실행 부분과 사용한 대체 표현을 알린다.
"""

# 의도: 조사에 필요한 최신 문서 조회와 전문 도구 및 작성 보완을 선택적으로 연결한다.
# 보존: 원본 조사 절차와 근거 확인을 유지하고 도구 사용을 설치나 권한 확대로 간주하지 않는다.
# 의도: 공통 조사 근거와 표현 기준이 격리 조사자와 외부 Draft 및 최종 요약에서도 유실되지 않게 전달한다.
schema_version = 1
runtime_note = """
## 문서 근거와 표현 연결

이 세션에 적용된 공통 작업 원칙의 '조사 근거와 표현'을 적용한다. 원본 firewall을 유지하면서 그 절의 기준을 조사자와 검증자 brief 및 외부 도구용 Draft 프롬프트에도 전달한다. 원문 사실, 출처 작성자의 주장, 자체 추론과 미확인을 구분한 채 digest, Process와 synthesis 및 최종 문서나 시각화에 보존한다. 여러 도구의 보고서가 일치해도 기초 출처의 독립성과 직접 확인 범위를 확인하고, 2차 자료의 일치를 공식 확인으로 바꾸지 않는다. 이 연결은 원본의 추가 검증 기준을 완화하지 않는다.

일반 조사와 대안 선정은 이 skill이 소유한다. 라이브러리 API나 특정 버전의 근거가 필요한 부분만 [find-docs](../find-docs/SKILL.md)에 라이브러리, 버전과 질문을 전달해 적용하고 출처와 확인 범위를 받는다. Context7 결과를 전체 조사나 비교의 대체로 쓰지 않는다. 이미 충분한 공식 근거가 있으면 추가 조회하지 않는다.

조사 결과를 그림으로 설명할 때 구조와 흐름은 [archify](../archify/SKILL.md), 수치 차트와 업무 시각화는 [diagram-design](../diagram-design/SKILL.md)를 선택해 확인된 내용, 독자와 산출 형식을 전달한다. 결과 파일과 생략 내역을 받고 원본 조사 근거를 보존한다. 대상 부재는 조사 전체를 차단하지 않으며 미실행 부분과 사용한 대체 표현을 알린다.
"""

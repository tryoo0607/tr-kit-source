# 의도: 목적과 기존 합의 및 최신 정정을 원본 brief와 선택적 공동 작성에 연결한다.
# 보존: 담당 산출물의 요구와 검증 책임을 유지하고 별도 기록 사본이나 일괄 인터뷰를 만들지 않는다.
schema_version = 1
runtime_note = "## 요구와 합의 연결\n\nDiscovery와 요구 정리에서 기존 입력, 최신 사용자 정정, 합의와 미결을 소비한다. 중요한 해석, 선택 축소 또는 권한 충돌이 있으면 [작업 흐름](../../workflow.md)의 '요구 변경과 전환'만 적용한다. Finalize에서는 다음 담당이 소비할 목적, 제약, 가정과 미결 및 자료 포인터를 기존 산출물에 남기고 원본 기록과 검증 결과를 확인한다. 원본 Discovery, Fast/Coaching, memlog와 Finalize 절차는 유지하며 렌더 후에도 이 연결을 적용한다.\n\n## 선택적 공동 작성 연결\n\n독자와 설명 깊이를 맞추거나 자료를 문서로 다듬는 과정이 필요할 때만 [doc-coauthoring](../doc-coauthoring/SKILL.md)에 요청된 정본, 기존 자료, 독자와 보존할 요구를 전달해 해당 지침을 적용한다. 결과는 문서 수정과 독자 관점의 모호함이며 이 skill의 요구, 산출 형식과 사실 검증 및 완료 판단은 유지한다. 이미 충분한 결과는 재사용하고 별도 계획이나 사본을 만들지 않는다. 대상 부재 시 이 skill의 원래 절차로 작성하고 독립 독자 검토의 미실행을 밝힌다. README 작성, 파일 검색, 기록 보관과 게시는 기존 담당을 유지한다."

## 선택적 근거와 도식 연결

설계 결정과 원본 memlog는 이 skill이 소유한다. 라이브러리의 특정 버전 API가 결정에 영향을 줄 때만 [find-docs](../find-docs/SKILL.md)에 버전과 질문을 전달해 해당 지침을 적용하고 공식 근거와 확인 범위를 받는다. 설명용 그림이 필요할 때만 [diagram-design](../diagram-design/SKILL.md)에 확정된 구조와 독자, 필요한 형식을 전달한다. 도식의 생략 내역과 파일 위치를 받고 결정 원문은 유지한다. 이미 충분한 근거와 도식은 재사용한다. 대상이 없으면 확인한 근거와 텍스트 설명을 제공하고 미실행 범위를 밝힌다.
"""
